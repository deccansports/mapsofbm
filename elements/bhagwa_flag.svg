<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Bhagwa Flag — Saffron Orange #FF7722 -->
  <!-- Flagpole -->
  <rect x="44" y="20" width="6" height="200" rx="3" fill="#8B6914"/>
  <!-- Flag fabric with wave -->
  <path d="M50,25 Q90,35 130,25 Q160,18 180,30 L180,110 Q160,122 130,112 Q90,122 50,112 Z" fill="#FF7722"/>
  <!-- Flag highlight/sheen -->
  <path d="M50,25 Q90,35 130,25 Q160,18 180,30 L180,55 Q160,45 130,52 Q90,60 50,50 Z" fill="#FF9944" opacity="0.5"/>
  <!-- Flame / Om symbol on flag -->
  <text x="115" y="78" text-anchor="middle" font-family="serif" font-size="36" fill="#C9A84C" opacity="0.9">ॐ</text>
  <!-- Tassels at bottom of flag -->
  <line x1="60" y1="112" x2="58" y2="128" stroke="#FF7722" stroke-width="2"/>
  <line x1="75" y1="115" x2="73" y2="131" stroke="#FF7722" stroke-width="2"/>
  <line x1="90" y1="117" x2="88" y2="133" stroke="#FF7722" stroke-width="2"/>
  <line x1="105" y1="118" x2="103" y2="134" stroke="#FF7722" stroke-width="2"/>
  <!-- Pole finial -->
  <polygon points="47,20 50,8 53,20" fill="#C9A84C"/>
  <circle cx="50" cy="8" r="5" fill="#E8D060"/>
  <text x="100" y="238" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#FF7722" font-weight="bold" letter-spacing="1">BHAGWA FLAG</text>
</svg>
