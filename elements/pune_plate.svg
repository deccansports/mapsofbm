<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Pune Plate — Deep Maroon #7B0D1E -->
  <defs>
    <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9B1530"/>
      <stop offset="50%" stop-color="#7B0D1E"/>
      <stop offset="100%" stop-color="#5A0815"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D060"/>
      <stop offset="100%" stop-color="#C9A84C"/>
    </linearGradient>
  </defs>
  <!-- Plate shadow -->
  <rect x="22" y="42" width="160" height="120" rx="14" fill="#3A0610" opacity="0.4"/>
  <!-- Main plate -->
  <rect x="18" y="38" width="164" height="118" rx="12" fill="url(#plateGrad)"/>
  <!-- Plate border ornament -->
  <rect x="22" y="42" width="156" height="110" rx="10" fill="none" stroke="#C9A84C" stroke-width="2.5"/>
  <rect x="27" y="47" width="146" height="100" rx="8" fill="none" stroke="#E8D060" stroke-width="1" opacity="0.6"/>
  <!-- Corner bolts -->
  <circle cx="32" cy="52" r="5" fill="#C9A84C"/>
  <circle cx="168" cy="52" r="5" fill="#C9A84C"/>
  <circle cx="32" cy="144" r="5" fill="#C9A84C"/>
  <circle cx="168" cy="144" r="5" fill="#C9A84C"/>
  <!-- Top emblem area -->
  <ellipse cx="100" cy="70" rx="22" ry="12" fill="#C9A84C" opacity="0.25"/>
  <!-- Lion / Seal emblem (simplified) -->
  <circle cx="100" cy="70" r="14" fill="none" stroke="#C9A84C" stroke-width="1.5"/>
  <text x="100" y="75" text-anchor="middle" font-family="serif" font-size="16" fill="#C9A84C">🦁</text>
  <!-- PUNE text -->
  <text x="100" y="110" text-anchor="middle" font-family="Georgia,serif" font-size="28" fill="url(#goldText)" font-weight="bold" letter-spacing="5">PUNE</text>
  <!-- Decorative line under PUNE -->
  <line x1="38" y1="118" x2="162" y2="118" stroke="#C9A84C" stroke-width="1.5"/>
  <line x1="38" y1="121" x2="162" y2="121" stroke="#E8D060" stroke-width="0.8" opacity="0.6"/>
  <!-- Sub-text: महाराष्ट्र -->
  <text x="100" y="138" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C9A84C" letter-spacing="2" opacity="0.9">महाराष्ट्र</text>
  <text x="100" y="232" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#7B0D1E" font-weight="bold" letter-spacing="1">PUNE PLATE</text>
</svg>
