<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <!-- Sky — Royal Blue #4169E1 -->
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A3DA8"/>
      <stop offset="60%" stop-color="#4169E1"/>
      <stop offset="100%" stop-color="#6B8FEF"/>
    </linearGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#FFEB7A"/>
      <stop offset="100%" stop-color="#FFC200"/>
    </radialGradient>
  </defs>
  <!-- Sky background -->
  <rect width="200" height="200" rx="10" fill="url(#skyGrad)"/>
  <!-- Sun -->
  <circle cx="155" cy="45" r="24" fill="url(#sunGrad)"/>
  <!-- Sun rays -->
  <line x1="155" y1="14" x2="155" y2="6"  stroke="#FFEB7A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="179" y1="21" x2="185" y2="15" stroke="#FFEB7A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="186" y1="45" x2="194" y2="45" stroke="#FFEB7A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="179" y1="69" x2="185" y2="75" stroke="#FFEB7A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="131" y1="21" x2="125" y2="15" stroke="#FFEB7A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="124" y1="45" x2="116" y2="45" stroke="#FFEB7A" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Cloud 1 -->
  <ellipse cx="55" cy="55" rx="30" ry="14" fill="white" opacity="0.85"/>
  <ellipse cx="40" cy="58" rx="18" ry="12" fill="white" opacity="0.85"/>
  <ellipse cx="70" cy="58" rx="18" ry="12" fill="white" opacity="0.85"/>
  <!-- Cloud 2 -->
  <ellipse cx="130" cy="90" rx="25" ry="11" fill="white" opacity="0.7"/>
  <ellipse cx="115" cy="93" rx="15" ry="10" fill="white" opacity="0.7"/>
  <ellipse cx="145" cy="93" rx="15" ry="10" fill="white" opacity="0.7"/>
  <!-- Stars -->
  <circle cx="20" cy="25" r="2" fill="white" opacity="0.8"/>
  <circle cx="35" cy="15" r="1.5" fill="white" opacity="0.6"/>
  <circle cx="90" cy="30" r="1.5" fill="white" opacity="0.5"/>
  <!-- Horizon glow -->
  <rect x="0" y="165" width="200" height="35" rx="0" fill="#FF9944" opacity="0.25"/>
  <!-- Ground/hills silhouette -->
  <path d="M0,200 Q50,175 100,185 Q150,175 200,185 L200,200 Z" fill="#1A3DA8" opacity="0.6"/>
  <text x="100" y="228" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#4169E1" font-weight="bold" letter-spacing="1">SKY</text>
</svg>
